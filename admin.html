<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof of Mind - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-black mb-6 text-sky-400">🛡️ Proof of Mind Admin Dashboard</h1>
        
        <!-- Task Management Section -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl mb-6">
            <h2 class="text-xl font-bold mb-4">Manage Social Tasks</h2>
            <div id="adminTasksList" class="flex flex-col gap-3 mb-4"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://proof-of-mind-api.onrender.com";

        async function loadAdminTasks() {
            const res = await fetch(`${API_URL}/api/tasks`);
            const data = await res.json();
            if(data.success) {
                document.getElementById('adminTasksList').innerHTML = data.tasks.map(t => `
                    <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <span>${t.icon} <b>${t.title}</b> (${t.reward} PoM)</span>
                        <span class="text-xs text-sky-400 truncate max-w-xs">${t.url}</span>
                    </div>
                `).join('');
            }
        }
        loadAdminTasks();
    </script>
</body>
</html>
