<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PoM Master Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-4 min-h-screen font-sans">

  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- Top Header -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-lg">
      <div>
        <h1 class="text-lg font-black text-sky-400">🧠 PoM सुप्रीम एडमिन कंसोल</h1>
        <p class="text-xs text-slate-400">लीडर सीक्रेट्स, एंटी-चीट व नेटवर्क मॉडरेशन</p>
      </div>
      <button onclick="toggleSystemPause()" id="pauseBtn" class="px-3 py-1.5 rounded-xl bg-amber-600/20 text-amber-300 border border-amber-500/30 text-xs font-bold transition">
        इमरजेंसी पॉज़
      </button>
    </div>

    <!-- Password Key -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">मास्टर पासवर्ड (Admin Key)</label>
      <input type="password" id="adminKey" value="POM_LEADER_CHIEF_2026" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none focus:border-sky-500" />
    </div>

    <!-- SECTION 1: LEADER ALPHA & WORDS -->
    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
      <h2 class="text-sm font-bold text-amber-300 flex items-center gap-2">
        <span>🔑</span> डेली सीक्रेट चैलेंज (लीडर्स के लिए उत्तर)
      </h2>

      <div>
        <label class="block text-xs text-slate-400 mb-1">गेम में दिखने वाले शब्द (कॉमा से अलग करें)</label>
        <textarea id="wordPoolInput" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none">Knowledge, Power, Decentralized, Human, Mind, Creates, Freedom, Network</textarea>
      </div>

      <div class="bg-sky-950/40 border border-sky-500/30 p-3 rounded-xl">
        <label class="block text-xs font-bold text-amber-300 mb-1">100% सही उत्तर (Secret Match)</label>
        <input type="text" id="targetAnswerInput" value="Decentralized Mind Creates Freedom" class="w-full bg-slate-800 border border-amber-500/50 rounded-lg p-2 text-xs font-bold text-amber-300 outline-none" />
      </div>

      <button onclick="updateChallengeOnServer()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-xl text-xs transition active:scale-95 shadow-md">
        लाइव गेम में सेव करें 🚀
      </button>

      <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
        <p class="text-[11px] text-slate-400 mb-1 font-semibold">लीडर्स को भेजने के लिए रेडीमेड क्लू:</p>
        <div id="clueMessage" class="text-xs text-slate-300 select-all font-mono break-words mb-2"></div>
        <button onclick="copyClue()" class="w-full py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold text-white transition">
          लीडर मैसेज कॉपी करें 📋
        </button>
      </div>
    </div>

    <!-- SECTION 2: ANTI-CHEAT & USER MODERATION -->
    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
      <h2 class="text-sm font-bold text-red-400 flex items-center gap-2">
        <span>🛡️</span> एंटी-चीट व यूजर मॉडरेशन (Freeze / Ban / Slash)
      </h2>

      <div class="flex gap-2">
        <input type="text" id="targetUserId" placeholder="यूज़र का Telegram ID दर्ज करें..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none focus:border-red-500" />
        <button onclick="fetchUserDetails()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-bold">
          जाँचें 🔍
        </button>
      </div>

      <!-- User Info Card -->
      <div id="userInfoBox" class="hidden bg-slate-800/60 border border-slate-700 p-3.5 rounded-xl space-y-2 text-xs">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <span class="font-bold text-white" id="uName">--</span>
          <span id="uStatus" class="px-2 py-0.5 rounded text-[10px] font-bold">Active</span>
        </div>
        <div class="grid grid-cols-2 gap-2 text-slate-400">
          <p>करंट बैलेंस: <b class="text-white" id="uBalance">0</b> PoM</p>
          <p>0.1 TON वेरिफाइड: <b class="text-white" id="uVerified">No</b></p>
        </div>

        <!-- Action Controls -->
        <div class="pt-3 border-t border-slate-700 flex flex-wrap gap-2">
          <button onclick="applyUserAction('FREEZE')" class="px-3 py-1.5 bg-amber-600/30 text-amber-300 border border-amber-500/40 rounded-lg text-xs font-bold">नोड फ़्रीज़ करें ❄️</button>
          <button onclick="applyUserAction('UNFREEZE')" class="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-lg text-xs font-bold">अन-फ़्रीज़ ☀️</button>
          <button onclick="applyUserAction('BAN')" class="px-3 py-1.5 bg-red-600 text-white rounded-lg text-xs font-bold">परमानेंट बैन 🚫</button>
          <button onclick="applyUserAction('UNBAN')" class="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-lg text-xs font-bold">अन-बैन</button>
          <button onclick="slashBalancePrompt()" class="px-3 py-1.5 bg-rose-950 text-rose-300 border border-rose-500/40 rounded-lg text-xs font-bold">टोकन काटें (Slash) ✂️</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const BACKEND_URL = "https://proof-of-mind-api.onrender.com";

    function updateClueBox() {
      const ans = document.getElementById("targetAnswerInput").value;
      const text = `🔥 SPECIAL VIP HINT 🔥\n\nProof of Mind का आज का 100% सही उत्तर:\n👉 "${ans}"\n\nइसे ऐप में अरेंज करके तुरंत PoM टोकन माइन कर लो और स्क्रीनशॉट ग्रुप में शेयर करके अपनी टीम को इनवाइट करो! 🚀\nhttps://t.me/proofofmind_bot`;
      document.getElementById("clueMessage").innerText = text;
    }
    document.getElementById("targetAnswerInput").addEventListener("input", updateClueBox);
    updateClueBox();

    function copyClue() {
      const text = document.getElementById("clueMessage").innerText;
      navigator.clipboard.writeText(text);
      alert("मैसेज कॉपी हो गया!");
    }

    async function updateChallengeOnServer() {
      const key = document.getElementById("adminKey").value;
      const words = document.getElementById("wordPoolInput").value.split(",").map(w => w.trim());
      const sentence = document.getElementById("targetAnswerInput").value.trim();

      const res = await fetch(`${BACKEND_URL}/api/admin/set-challenge`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ adminKey: key, targetWords: words, correctSentence: sentence })
      });
      const data = await res.json();
      alert(data.message || (data.success ? "सेव हो गया!" : "एरर"));
    }

    async function fetchUserDetails() {
      const key = document.getElementById("adminKey").value;
      const uid = document.getElementById("targetUserId").value.trim();
      if (!uid) return alert("ID दर्ज करें");

      const res = await fetch(`${BACKEND_URL}/api/admin/user-details`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ adminKey: key, targetUserId: uid })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById("userInfoBox").classList.remove("hidden");
        document.getElementById("uName").innerText = `${data.user.username || 'User'} (${data.user.userId})`;
        document.getElementById("uBalance").innerText = data.user.balance.toFixed(2);
        document.getElementById("uVerified").innerText = data.user.isVerified ? "हाँ ✔" : "नहीं ❌";
        
        const status = document.getElementById("uStatus");
        if (data.user.isBanned) {
          status.innerText = "BANNED";
          status.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/20 text-red-300 border border-red-500/40";
        } else if (data.user.isFrozen) {
          status.innerText = "FROZEN";
          status.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40";
        } else {
          status.innerText = "ACTIVE";
          status.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
        }
      } else {
        alert(data.message);
      }
    }

    async function applyUserAction(action, value = 0, reason = "") {
      const key = document.getElementById("adminKey").value;
      const uid = document.getElementById("targetUserId").value.trim();

      const res = await fetch(`${BACKEND_URL}/api/admin/user-action`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ adminKey: key, targetUserId: uid, action, value, reason })
      });
      const data = await res.json();
      alert(data.message);
      fetchUserDetails();
    }

    function slashBalancePrompt() {
      const val = prompt("नया बैलेंस कितना करना चाहते हैं? (0 दर्ज करने पर सारे टोकन कट जाएंगे):", "0");
      if (val !== null) {
        applyUserAction("SLASH_BALANCE", Number(val));
      }
    }

    async function toggleSystemPause() {
      const key = document.getElementById("adminKey").value;
      const res = await fetch(`${BACKEND_URL}/api/admin/toggle-pause`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ adminKey: key })
      });
      const data = await res.json();
      if (data.success) {
        alert(data.message);
        document.getElementById("pauseBtn").innerText = data.isPaused ? "सिस्टम चालू करें" : "इमरजेंसी पॉज़";
      }
    }
  </script>
</body>
</html>
